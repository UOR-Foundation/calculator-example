<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><link rel="stylesheet" href="app.css"></head><body><main><h1>Calculator</h1><form id="application-form" novalidate><label for="left">Left operand</label><input id="left" name="left" inputmode="numeric" autocomplete="off"><label for="operation">Operation</label><select id="operation" name="operation"><option value="0" data-request="add" selected>Add</option><option value="1" data-request="subtract">Subtract</option><option value="2" data-request="multiply">Multiply</option><option value="3" data-request="divide">Divide</option></select><label for="right">Right operand</label><input id="right" name="right" inputmode="numeric" autocomplete="off"><button id="submit" type="submit">Calculate</button></form><output id="result" role="status" aria-live="polite" aria-atomic="true"></output></main><script type="module" src="app.js"></script></body></html>
